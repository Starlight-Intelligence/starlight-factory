schema_version: "1.1"
name: no-trigger-new-tool
description: Should NOT trigger eve-host-port for adding agent behaviour.
tags: [trigger, should-not-trigger]
runs: 3
execution:
  prompt: "Add a tool to the analyst station that lists the repo's open pull requests."
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eve-host-port"'
    min: 0
    max: 0
