schema_version: "1.1"
name: no-trigger-sandbox-error-deployed
description: Boundary case. Diagnosing this deployed factory belongs to factory-launch.
tags: [trigger, should-not-trigger, boundary]
runs: 3
execution:
  prompt: "Our factory deploy on Railway fails during the build with a Vercel Sandbox authentication error. What's wrong?"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eve-host-port"'
    min: 0
    max: 0
