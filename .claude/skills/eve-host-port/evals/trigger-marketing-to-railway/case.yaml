schema_version: "1.1"
name: trigger-marketing-to-railway
description: Should trigger eve-host-port for moving an eve template off Vercel.
tags: [trigger]
runs: 3
execution:
  prompt: "We forked Vercel's eve marketing team template. How do we make it run on Railway instead of Vercel?"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eve-host-port"'
