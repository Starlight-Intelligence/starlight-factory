schema_version: "1.1"
name: task-hook-retry
description: Outcome case. A throwing channel hook can't make GitHub retry.
tags: [task]
runs: 3
execution:
  prompt: "In our self-hosted eve app, if onIssue throws when our database is down, will GitHub retry the webhook later?"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: no-retry-and-remedy
    type: llm
    weight: 3
    criteria: |
      PASS if the reply says GitHub will NOT retry, because eve answers the webhook before the hook runs and GitHub never redelivers automatically, and suggests a durable intake such as a queue or front door plus an idempotency or replay guard.
      FAIL if the reply says GitHub will retry, says throwing causes a redelivery, or gives no remedy for the lost event.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eve-host-port"'
