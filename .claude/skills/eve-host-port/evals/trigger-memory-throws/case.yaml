schema_version: "1.1"
name: trigger-memory-throws
description: Should trigger eve-host-port when fileMemory fails on a self-hosted eve app.
tags: [trigger]
runs: 3
execution:
  prompt: "Our eve personal agent works on Vercel but on our own Docker host fileMemory throws asking for an explicit backend. What do we need?"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eve-host-port"'
