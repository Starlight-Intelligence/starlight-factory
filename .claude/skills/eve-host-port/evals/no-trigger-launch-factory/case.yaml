schema_version: "1.1"
name: no-trigger-launch-factory
description: Should NOT trigger eve-host-port for launching this factory (factory-launch territory).
tags: [trigger, should-not-trigger]
runs: 3
execution:
  prompt: "Railway is back up. Create the factory's project and walk me through the GitHub App and the first labeled issue."
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eve-host-port"'
    min: 0
    max: 0
