schema_version: "1.1"
name: no-trigger-port-other-template
description: Should NOT trigger factory-launch for porting a different eve template (eve-host-port territory).
tags: [trigger, should-not-trigger]
runs: 3
execution:
  prompt: "We forked Vercel's eve marketing team template. How do we make it run on Railway instead of Vercel?"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?factory-launch"'
    min: 0
    max: 0
